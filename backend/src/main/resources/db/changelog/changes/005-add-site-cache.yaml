databaseChangeLog:
  - changeSet:
      id: 005-add-site-cache-columns-to-city-sources
      author: junior.vieira
      changes:
        - addColumn:
            tableName: city_sources
            columns:
              - column:
                  name: cache_enabled
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: cache_ttl_hours
                  type: INT
                  defaultValueNumeric: 6
                  constraints:
                    nullable: false
  - changeSet:
      id: 005-create-site-cache-table
      author: junior.vieira
      changes:
        - createTable:
            tableName: site_cache
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: city_source_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_site_cache_city_source
                    references: city_sources(id)
              - column:
                  name: term
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: content
                  type: CLOB
                  constraints:
                    nullable: false
              - column:
                  name: fetched_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: site_cache
            columnNames: city_source_id, term
            constraintName: uk_site_cache_source_term
