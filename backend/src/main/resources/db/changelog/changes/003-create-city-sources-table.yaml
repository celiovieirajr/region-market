databaseChangeLog:
  - changeSet:
      id: 003-create-city-sources-table
      author: junior.vieira
      changes:
        - createTable:
            tableName: city_sources
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_city_sources_user
                    references: users(id)
              - column:
                  name: city
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: label
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
              - column:
                  name: url
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_city_sources_user_city
            tableName: city_sources
            columns:
              - column:
                  name: user_id
              - column:
                  name: city
