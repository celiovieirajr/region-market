<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChatBot IA - Login</title>
    <script>
        (function () {
            var stored = localStorage.getItem('chatbot_theme');
            var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (stored ? stored === 'dark' : prefersDark) {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' };</script>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-gradient-to-br from-slate-900 to-slate-700 dark:from-black dark:to-slate-900 min-h-screen flex items-center justify-center relative">

    <button id="theme-toggle" title="Alternar tema claro/escuro"
            class="absolute top-4 right-4 w-9 h-9 flex items-center justify-center rounded-lg border border-white/20 text-white hover:bg-white/10 transition-colors text-lg">
        🌙
    </button>

    <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl w-full max-w-sm p-8">
        <div class="text-center mb-8">
            <div class="mx-auto w-14 h-14 rounded-full bg-indigo-600 flex items-center justify-center mb-3">
                <span class="text-white text-2xl">🤖</span>
            </div>
            <h1 class="text-2xl font-bold text-slate-800 dark:text-slate-100">ChatBot IA</h1>
            <p class="text-slate-500 dark:text-slate-400 text-sm mt-1">Faça login para conversar</p>
        </div>

        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1" for="username">Usuário</label>
                <input id="username" name="username" type="text" autocomplete="username"
                       class="w-full rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-800 dark:text-slate-100 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                       placeholder="admin" required />
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1" for="password">Senha</label>
                <input id="password" name="password" type="password" autocomplete="current-password"
                       class="w-full rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-800 dark:text-slate-100 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                       placeholder="••••••••" required />
            </div>

            <p id="login-error" class="text-red-600 dark:text-red-400 text-sm hidden"></p>

            <button id="login-btn" type="submit"
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg py-2.5 transition-colors">
                Entrar
            </button>
        </form>

        <p class="text-xs text-slate-400 dark:text-slate-500 text-center mt-6">Usuário de teste: admin / admin123</p>
        <p class="text-sm text-center mt-4 text-slate-600 dark:text-slate-400">
            Não tem conta?
            <a href="/index.html" class="text-indigo-600 dark:text-indigo-400 font-medium hover:underline">Voltar ao chat</a>
        </p>
    </div>

    <script src="js/model/apiModel.js"></script>
    <script src="js/view/loginView.js"></script>
    <script src="js/controller/themeController.js"></script>
    <script src="js/controller/loginController.js"></script>
</body>
</html>
